<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASYPRODUCT | Acceso</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
    <header>
        <a href="index.html" class="logo">🛍️ EASYPRODUCT</a>
        <nav><a href="index.html" class="nav-link">← Volver al catálogo</a></nav>
    </header>
    <main class="auth-card">
        <div class="auth-heading">
            <span class="auth-mark">E</span>
            <h1 id="authTitle">Bienvenido de nuevo</h1>
            <p id="authSubtitle">Inicia sesión para continuar</p>
        </div>
        <div class="auth-tabs" role="tablist">
            <button type="button" class="auth-tab active" id="loginTab">Iniciar Sesión</button>
            <button type="button" class="auth-tab" id="registerTab">Registrarse</button>
        </div>
        <form id="authForm">
            <div class="form-group" id="nameGroup" hidden>
                <label for="authName">Nombre completo</label>
                <input id="authName" name="nombre" autocomplete="name" maxlength="150">
            </div>
            <div class="form-group">
                <label for="authEmail">Correo electrónico</label>
                <input id="authEmail" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="authPassword">Contraseña</label>
                <input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="8" required>
                <small id="passwordHint" class="auth-hint" hidden>Usa al menos 8 caracteres.</small>
            </div>
            <p id="authMessage" class="auth-message" role="alert" aria-live="polite"></p>
            <button id="submitButton" class="btn btn-primary auth-submit" type="submit">Iniciar Sesión</button>
        </form>
    </main>
    <script src="auth.js"></script>
</body>
</html>
